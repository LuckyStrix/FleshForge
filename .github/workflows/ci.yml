name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    env:
      FLESHFORGE_SKIP_COLMAP: "1"   # no COLMAP or GPU on the runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libegl1 libgl1 libgomp1
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest -q
