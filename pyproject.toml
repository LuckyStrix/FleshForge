[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fleshforge"
version = "0.1.0"
description = "Phone video of a head to a printable, vertex-coloured 3D model (COLMAP photogrammetry), for multi-toolhead printing with stackforge"
readme = "README.md"
# open3d has no wheels for 3.13+
requires-python = ">=3.10,<3.13"
license = { file = "LICENSE" }
dependencies = ["numpy", "Pillow", "scipy", "opencv-python-headless", "open3d", "rembg", "onnxruntime"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
fleshforge-scan = "fleshforge.tools.scan:main"
fleshforge-check = "fleshforge.tools.check:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
# real mistakes only (pyflakes + pycodestyle errors); the codebase's style is not enforced
select = ["E4", "E7", "E9", "F"]
